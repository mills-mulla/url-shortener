services:
    api:
        container_name: apishortener
        build: .
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
        env_file: 
            - .env
        ports:
            - "8000:8000"
        volumes:
            - .:/srv
        networks:
            - devnet

    worker:
        container_name: apiworker
        build: .
        command: python -m worker.consumer
        env_file: 
                - .env
        volumes:
                - .:/srv
        networks:
                - devnet
        restart: unless-stopped


networks:
    devnet:
        external: true